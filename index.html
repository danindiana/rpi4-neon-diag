<!DOCTYPE html>
<html>
<head>
    <title>RPI4 Neon Diagnostics - Mission Control</title>
    <script src="assets/lib/d3.min.js"></script>
    <script src="assets/lib/hpcc-wasm.min.js"></script>
    <script src="assets/lib/d3-graphviz.js"></script>
    <style>
        :root {
            --neon-cyan: #00FFFF;
            --neon-magenta: #FF00FF;
            --neon-green: #39FF14;
            --neon-yellow: #FFFF33;
            --bg-dark: #0D0D0D;
            --panel-bg: #1A1A1A;
        }
        body { background-color: var(--bg-dark); color: var(--neon-cyan); font-family: "Monospace", Courier, monospace; margin: 0; padding: 20px; text-align: center; overflow-x: hidden; }
        h1 { color: var(--neon-magenta); text-shadow: 0 0 10px var(--neon-magenta); margin-bottom: 5px; }
        .subtitle { color: var(--neon-green); margin-bottom: 20px; font-size: 1.1em; }
        .controls { margin-bottom: 30px; background: var(--panel-bg); padding: 15px; border: 1px solid #333; display: inline-block; border-radius: 10px; }
        button { background: var(--bg-dark); color: var(--neon-green); border: 1px solid var(--neon-green); padding: 8px 20px; cursor: pointer; font-family: inherit; margin: 0 10px; border-radius: 4px; font-weight: bold; }
        button.active { background: var(--neon-magenta); color: #FFF; border-color: var(--neon-magenta); }
        .grid { display: flex; flex-wrap: wrap; justify-content: center; gap: 20px; }
        .diagram { padding: 15px; border: 2px solid var(--neon-green); background: var(--panel-bg); width: 400px; border-radius: 8px; }
        h2 { color: var(--neon-yellow); font-size: 1.1em; border-bottom: 1px solid var(--neon-magenta); padding-bottom: 5px; }
        img { max-width: 100%; height: auto; border: 1px solid var(--neon-magenta); margin-top: 10px; min-height: 100px; background: #000; }
        #graph-container { width: 95vw; height: 75vh; margin: 0 auto; background: var(--panel-bg); border: 2px solid var(--neon-magenta); position: relative; border-radius: 10px; display: none; overflow: hidden; }
        #graph { width: 100%; height: 100%; }
        #graph svg { width: 100% !important; height: 100% !important; display: block !important; }
        #graph g polygon { fill: #0D0D0D !important; }
        #graph g text { fill: #00FFFF !important; font-family: Monospace !important; }
        #graph g path { stroke: #39FF14 !important; }
        #graph g ellipse { stroke: #FF00FF !important; fill: #1A1A1A !important; }
        #debug-console { position: fixed; bottom: 10px; left: 10px; right: 10px; height: 80px; background: rgba(0,0,0,0.9); color: #00FF00; font-size: 11px; text-align: left; padding: 10px; overflow-y: auto; border: 1px solid var(--neon-magenta); pointer-events: none; z-index: 1000; font-family: "Courier New", Courier, monospace; }
        .hidden { display: none !important; }
        footer { margin-top: 60px; font-size: 0.85em; color: #666; border-top: 1px solid #333; padding-top: 25px; }
        select { background: var(--bg-dark); color: var(--neon-cyan); border: 1px solid var(--neon-cyan); padding: 8px; font-family: inherit; border-radius: 4px; }
    </style>
</head>
<body>
    <h1>RPI4 NEON DIAGNOSTICS</h1>
    <div class="subtitle">NODE-ALPHA :: 192.168.1.165</div>
    <div class="controls">
        <button id="btn-static" class="active" onclick="showStatic()">Gallery</button>
        <button id="btn-live" onclick="showLive()">Live Graph</button>
        <span id="live-controls" class="hidden">
            <select id="graph-selector" onchange="loadGraph()">
                <option value="docs/diagrams/networking.dot">Networking Pulse</option>
                <option value="docs/diagrams/health.dot">System Vitals</option>
                <option value="docs/diagrams/services.dot">Active Armada</option>
                <option value="docs/diagrams/chronology.dot">The Story So Far</option>
                <option value="docs/diagrams/config.dot">Blueprint Layout</option>
                <option value="docs/diagrams/service_flow.dot">Service Flow</option>
                <option value="docs/diagrams/repo_arch.dot">Repo Architecture</option>
                <option value="docs/diagrams/conditioning_chain.dot">Conditioning Chain</option>
                <option value="docs/diagrams/firmware.dot">Power & Firmware Pulse</option>
            </select>
            <button onclick="loadGraph()">Refresh</button>
        </span>
    </div>
    <div id="static-view">
        <div class="grid">
            <div class="diagram"><h2>Networking Pulse</h2><img src="assets/networking.png"></div>
            <div class="diagram"><h2>System Vitals</h2><img src="assets/health.png"></div>
            <div class="diagram"><h2>Active Armada</h2><img src="assets/services.png"></div>
            <div class="diagram"><h2>The Story So Far</h2><img src="assets/chronology.png"></div>
            <div class="diagram"><h2>Blueprint Layout</h2><img src="assets/config.png"></div>
            <div class="diagram"><h2>Service Flow</h2><img src="assets/service_flow.png"></div>
            <div class="diagram"><h2>Repo Architecture</h2><img src="assets/repo_arch.png"></div>
            <div class="diagram"><h2>Conditioning Chain</h2><img src="assets/conditioning_chain.png"></div>
            <div class="diagram"><h2>Power & Firmware</h2><img src="assets/firmware.png"></div>
        </div>
    </div>
    <div id="graph-container"><div id="graph"></div></div>
    <div id="debug-console">SYSTEM STANDBY...</div>
    <script>
        function log(msg) {
            const console = document.getElementById("debug-console");
            const entry = document.createElement("div");
            entry.textContent = "[" + new Date().toLocaleTimeString() + "] " + msg;
            console.prepend(entry);
        }
        let renderer = null;
        function showStatic() {
            document.getElementById("static-view").style.display = "block";
            document.getElementById("graph-container").style.display = "none";
            document.getElementById("live-controls").classList.add("hidden");
            document.getElementById("btn-static").classList.add("active");
            document.getElementById("btn-live").classList.remove("active");
        }
        function showLive() {
            document.getElementById("static-view").style.display = "none";
            document.getElementById("graph-container").style.display = "block";
            document.getElementById("live-controls").classList.remove("hidden");
            document.getElementById("btn-static").classList.remove("active");
            document.getElementById("btn-live").classList.add("active");
            if (!renderer) {
                log("Initializing Local Graphviz Engine...");
                try {
                    // Check for @hpcc-js/wasm (usually exports as hpccWasm or @hpcc-js/wasm)
                    const wasmProvider = window["@hpcc-js/wasm"] || window["hpccWasm"];
                    if (wasmProvider) {
                        wasmProvider.wasmFolder("assets/lib");
                        log("WASM Folder set to assets/lib");
                    } else {
                        log("WARN: WASM provider not found in window object.");
                    }
                    
                    renderer = d3.select("#graph")
                        .graphviz()
                        .on("initEnd", () => {
                            log("Local Engine Ready.");
                            loadGraph();
                        });
                } catch (e) {
                    log("JS ERROR: " + e.message);
                    console.error(e);
                }
            } else {
                loadGraph();
            }
        }
        function loadGraph() {
            if (!renderer) return;
            const file = document.getElementById("graph-selector").value;
            log("Fetching " + file + "...");
            fetch(file + "?t=" + Date.now())
                .then(r => { if (!r.ok) throw new Error("HTTP " + r.status); return r.text(); })
                .then(dot => {
                    log("Data retrieved. Rendering...");
                    const w = document.getElementById("graph").offsetWidth || 800;
                    const h = document.getElementById("graph").offsetHeight || 600;
                    renderer.width(w).height(h).fit(true).zoom(true).renderDot(dot);
                    log("Render complete: " + file);
                })
                .catch(err => {
                    log("ERROR: " + err.message);
                    document.getElementById("graph").innerHTML = "<div style=\"color:red; padding-top:20%;\">" + err.message + "</div>";
                });
        }
        log("Diagnostic Node 192.168.1.165 Online.");
    </script>
    <footer>SECURE DIAGNOSTIC NODE 192.168.1.165 | <a href="https://github.com/danindiana/rpi4-neon-diag" style="color:var(--neon-yellow);">GITHUB REPO</a></footer>
</body>
</html>
